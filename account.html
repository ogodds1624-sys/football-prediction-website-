<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Account - Football Predictions</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="admin-page">
    <section class="admin-card" aria-labelledby="account-title">
      <h1 id="account-title">Sign in</h1>
      <p id="account-subtitle">Sign in to get access to our predictions.</p>

      <div class="match-days account-tabs" role="group" aria-label="Account">
        <button type="button" class="day-button" id="tab-login" aria-pressed="true">Sign in</button>
        <button type="button" class="day-button" id="tab-register" aria-pressed="false">Create account</button>
      </div>

      <form class="admin-form" id="account-form" novalidate>
        <div id="name-row" hidden>
          <label for="name" class="visually-hidden">Full name</label>
          <div class="passcode-field">
            <input type="text" id="name" placeholder="Full name" autocomplete="name" maxlength="60">
          </div>
        </div>
        <div class="admin-form-fields" id="login-fields">
          <label for="email" class="visually-hidden">Email</label>
          <div class="passcode-field">
            <input type="email" id="email" placeholder="Email" autocomplete="email" required>
          </div>
          <label for="password" class="visually-hidden">Password</label>
          <div class="passcode-field">
            <input type="password" id="password" placeholder="Password" autocomplete="current-password" minlength="8" required>
          </div>
        </div>
        <p class="admin-error" id="account-error" role="alert"></p>
        <button type="submit" class="admin-submit" id="account-submit">SIGN IN</button>
      </form>
      <a class="back-button" href="index.html"><span class="back-arrow" aria-hidden="true">←</span> Back to predictions</a>
    </section>
  </main>
  <script src="account.js"></script>
  <script src="ui.js"></script>
</body>
</html>
